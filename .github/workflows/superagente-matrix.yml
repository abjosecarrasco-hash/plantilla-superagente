name: Superagente Matrix cifrado (latido 5 min)
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  latido-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Restaurar estado privado (sesión E2E)
        env:
          GT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API="https://api.github.com/repos/${{ github.repository }}/actions/artifacts"
          LISTA=$(curl -s -H "Authorization: Bearer $GT" "$API?per_page=100")
          AID=$(echo "$LISTA" | python3 -c "
import json,sys
arts=[a for a in json.load(sys.stdin).get('artifacts',[]) if a['name']=='estado-matrix' and not a['expired']]
print(max(arts, key=lambda a: a['created_at'])['id'] if arts else '')")
          if [ -n "$AID" ]; then
            curl -sL -H "Authorization: Bearer $GT" -H "Accept: application/vnd.github+json" \
              "$API/$AID/zip" -o estado.zip
            unzip -o estado.zip && rm estado.zip
            echo "estado restaurado (artefacto $AID)"
          else
            echo "sin artefacto previo: login fresco"
          fi
      - run: pip install "matrix-nio[e2e]"
      - run: python3 agente_matrix.py
        env:
          MATRIX_HOMESERVER: ${{ secrets.MATRIX_HOMESERVER }}
          MATRIX_USUARIO: ${{ secrets.MATRIX_USUARIO }}
          MATRIX_PASSWORD: ${{ secrets.MATRIX_PASSWORD }}
          MATRIX_FRASE: ${{ secrets.MATRIX_FRASE }}
      - name: Respaldo privado de sesión y claves (NUNCA en git)
        uses: actions/upload-artifact@v4
        with:
          name: estado-matrix
          path: |
            matrix_sesion.json
            matrix_cripto.db
          if-no-files-found: ignore
          retention-days: 90
      - name: Persistir memoria del negocio (sin secretos)
        run: |
          git config user.name "superagente-bot"
          git config user.email "bot@glsystems.local"
          for f in memoria.json registros.json perfil_negocio.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "sin cambios que persistir"
          else
            git commit -m "latido matrix: memoria del negocio actualizada"
            git push
          fi
