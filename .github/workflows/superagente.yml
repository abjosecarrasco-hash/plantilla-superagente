name: Superagente (latido 5 min)
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  latido:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python3 agente_telegram.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      - name: Persistir memoria
        run: |
          git config user.name "superagente-bot"
          git config user.email "bot@glsystems.local"
          git add memoria.json registros.json perfil_negocio.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "latido: memoria actualizada"
          git push
